<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frame — SwarmUI</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/gpu.css"></head>
<body>
<header><a class="brand" href="/">◈ <span>FRAME<span class="brand-sub"> / SWARMUI</span></span></a></header>
<section class="gpu-section">
<div class="section-head"><div><p class="eyebrow">МОИ СЕРВЕРЫ</p><h2>SwarmUI на Vast.ai</h2><p class="muted">Ссылка на SwarmUI появляется, когда сервер полностью готов.</p></div><button id="vast-refresh" class="secondary">Обновить ↻</button></div>
<p id="vast-message" class="notice">Проверяем настройку Vast.ai…</p>
<div id="instances" class="server-list"></div>
<div class="rent-panel">
<h2>Новый сервер</h2>
<form id="offer-form">
<fieldset><legend>GPU</legend><label class="check"><input type="checkbox" name="gpu" value="RTX 3090" checked> RTX 3090</label><label class="check"><input type="checkbox" name="gpu" value="RTX 4090" checked> RTX 4090</label><label class="check"><input type="checkbox" name="gpu" value="RTX A5000" checked> RTX A5000</label><label class="check"><input type="checkbox" name="gpu" value="RTX 5090"> RTX 5090</label></fieldset>
<div class="row"><div><label for="max-price">До $/час</label><input id="max-price" type="number" min="0.01" max="20" step="0.01" value="0.45"></div><div><label for="disk">Диск, ГБ</label><input id="disk" type="number" min="50" max="2000" step="10" value="60"></div></div>
<button class="primary" type="submit">Найти серверы <span>↗</span></button>
</form>
<div id="offers" class="server-grid"></div>
</div>
</section>
<script src="/static/app.js" defer></script></body></html>
