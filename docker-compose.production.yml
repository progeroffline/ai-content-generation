services:
  studio:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      STUDIO_DATA: /data
      STUDIO_HOST: 0.0.0.0
      STUDIO_PORT: 8090
    volumes:
      - studio_data:/data
    networks: [frame]
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [frame]
    depends_on: [studio]
networks:
  frame:
volumes:
  studio_data:
  caddy_data:
  caddy_config:
