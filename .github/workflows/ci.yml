name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q studio scripts tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check studio/static/app.js
      - run: cp .env.example .env && docker compose config
        env:
          STUDIO_PASSWORD: ci-password-never-deploy
