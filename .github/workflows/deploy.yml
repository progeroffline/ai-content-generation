name: Deploy control panel

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.ENABLE_DEPLOY == 'true' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: [self-hosted, frame-prod]
    concurrency:
      group: frame-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy tested commit
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          sudo -n /usr/local/sbin/frame-deploy "$DEPLOY_SHA"
